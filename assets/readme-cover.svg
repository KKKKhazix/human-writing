<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">活人感写作</title>
  <desc id="desc">通用中文创作与改稿 Skill</desc>
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F8F4EC"/>
      <stop offset="1" stop-color="#EEE5D8"/>
    </linearGradient>
    <linearGradient id="ink" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#242321"/>
      <stop offset="1" stop-color="#4B4742"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="420" rx="28" fill="url(#paper)"/>
  <circle cx="1115" cy="52" r="180" fill="#C4473A" opacity="0.055"/>
  <circle cx="1140" cy="30" r="108" fill="none" stroke="#C4473A" stroke-width="2" opacity="0.18"/>
  <circle cx="92" cy="388" r="150" fill="#A69784" opacity="0.07"/>
  <path d="M80 88 H362" stroke="#C4473A" stroke-width="3"/>
  <path d="M80 328 H810" stroke="#BEB2A3" stroke-width="1"/>

  <text x="80" y="72" fill="#C4473A" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18" font-weight="700" letter-spacing="3">HUMAN WRITING</text>
  <text x="80" y="192" fill="url(#ink)" font-family="'PingFang SC', 'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" font-size="76" font-weight="700" letter-spacing="2">活人感写作</text>
  <text x="84" y="250" fill="#625D56" font-family="'PingFang SC', 'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" font-size="27">写事实，写行动，写得像一个人在说话</text>

  <g font-family="'PingFang SC', 'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" font-size="18" fill="#3E3A36">
    <rect x="80" y="284" width="126" height="42" rx="21" fill="#FFFFFF" opacity="0.72"/>
    <text x="143" y="311" text-anchor="middle">现实写作</text>
    <rect x="220" y="284" width="126" height="42" rx="21" fill="#FFFFFF" opacity="0.72"/>
    <text x="283" y="311" text-anchor="middle">虚构创作</text>
    <rect x="360" y="284" width="126" height="42" rx="21" fill="#FFFFFF" opacity="0.72"/>
    <text x="423" y="311" text-anchor="middle">中文韵律</text>
  </g>

  <g transform="translate(928 120)">
    <rect width="154" height="154" rx="30" fill="#C4473A" opacity="0.10"/>
    <rect x="12" y="12" width="130" height="130" rx="22" fill="none" stroke="#C4473A" stroke-width="2" opacity="0.48"/>
    <text x="77" y="103" text-anchor="middle" fill="#C4473A" font-family="'STKaiti', 'KaiTi', serif" font-size="76" font-weight="700">写</text>
  </g>

  <text x="1118" y="367" text-anchor="end" fill="#7A7168" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="17" letter-spacing="1">A GENERAL CHINESE WRITING SKILL</text>
</svg>
